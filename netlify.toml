# Die Seite selbst hat keinen Build-Schritt: das Repo wird so ausgeliefert, wie
# es ist. Gebaut wird nur die Edge-Function für Jarvis aus
# netlify/edge-functions (npm install macht Netlify automatisch, sobald eine
# package.json da ist).

[build]
  publish = "."

# Jarvis ist privat und gehört nicht in Suchmaschinen.
[[headers]]
  for = "/jarvis/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/jarvis/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Android sucht die Verknüpfung zur App unter /.well-known/. Punkt-Ordner
# liefert Netlify nicht aus, deshalb liegt die Datei ohne Punkt im Repo und
# wird hierher umgeschrieben (200, keine Weiterleitung — Android folgt keiner).
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/assetlinks.json"
  status = 200
  force = true

# Quelltext und Konfiguration liegen im selben Ordner wie die Seite, gehören
# aber nicht ausgeliefert.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/server/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/index.html"
  status = 404
  force = true
