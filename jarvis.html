<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16283D;
    --ink-soft:#4A5C70;
    --paper:#F3EEE1;
    --card:#FFFDF8;
    --line:#DCD4BE;
    --accent:#D9631F;
    --accent-soft:#F3DAC4;
    --danger:#B3402A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }

  /* Header */
  .app__header{
    background:var(--ink);
    color:var(--paper);
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    padding-top:max(14px, env(safe-area-inset-top));
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .level{width:30px;height:30px;flex-shrink:0;}
  .level__bubble{transform-origin:center;animation:none;}
  .brand__text{display:flex;flex-direction:column;line-height:1.15;}
  .brand__name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;letter-spacing:.2px;}
  .brand__tag{font-size:11px;color:#B9C4D1;}
  .header__actions{display:flex;align-items:center;gap:6px;}
  .status{display:flex;align-items:center;gap:6px;font-size:11px;color:#B9C4D1;margin-right:2px;}
  .status__dot{width:7px;height:7px;border-radius:50%;background:var(--accent);transition:background .2s;}
  .status.busy .status__dot{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .icon-btn{
    background:transparent;
    border:none;
    color:#B9C4D1;
    width:34px;height:34px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.08);color:var(--paper);}
  .icon-btn svg{width:18px;height:18px;}

  /* Chat area */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 8px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(22,40,61,.05) 27px, rgba(22,40,61,.05) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(22,40,61,.05) 27px, rgba(22,40,61,.05) 28px);
  }
  .msg{
    max-width:82%;
    padding:10px 13px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.45;
    white-space:pre-wrap;
    word-wrap:break-word;
    animation:rise .18s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .msg.user{
    align-self:flex-end;
    background:var(--ink);
    color:var(--paper);
    border-bottom-right-radius:4px;
  }
  .msg.assistant{
    align-self:flex-start;
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .msg.error{
    align-self:flex-start;
    background:#FBEAE5;
    color:var(--danger);
    border:1px solid #E6B7A8;
    border-bottom-left-radius:4px;
  }
  .msg.loading{display:flex;align-items:center;gap:8px;padding:12px 14px;}
  .loading__level{width:26px;height:16px;border:1.5px solid var(--ink-soft);border-radius:9px;position:relative;flex-shrink:0;}
  .loading__level i{position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--accent);animation:slide 1.1s ease-in-out infinite alternate;}
  @keyframes slide{from{left:2px;}to{left:calc(100% - 11px);}}
  .loading__label{font-size:13px;color:var(--ink-soft);}

  /* Composer */
  .composer{
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:10px 10px;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
    background:var(--paper);
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .composer__input{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    border-radius:16px;
    padding:9px 14px;
    font-family:inherit;
    font-size:15px;
    max-height:110px;
    line-height:1.4;
  }
  .composer__input:focus{outline:none;border-color:var(--accent);}
  .composer .icon-btn{color:var(--ink-soft);flex-shrink:0;}
  .composer .icon-btn:hover{background:var(--accent-soft);color:var(--ink);}
  .composer .icon-btn.active{background:var(--accent);color:#fff;}
  .composer .send{background:var(--ink);color:var(--paper);}
  .composer .send:hover{background:var(--ink);opacity:.9;}
  .composer .send:disabled{opacity:.4;cursor:default;}

  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div class="app">
  <header class="app__header">
    <div class="brand">
      <svg class="level" viewBox="0 0 32 32" fill="none">
        <rect x="2" y="11" width="28" height="10" rx="5" stroke="var(--paper)" stroke-width="1.6"/>
        <circle class="level__bubble" id="headerBubble" cx="16" cy="16" r="3.4" fill="var(--accent)"/>
      </svg>
      <div class="brand__text">
        <span class="brand__name">Jarvis</span>
        <span class="brand__tag">Persönlicher Assistent</span>
      </div>
    </div>
    <div class="header__actions">
      <span class="status" id="status"><span class="status__dot"></span><span id="statusLabel">bereit</span></span>
      <button class="icon-btn" id="resetBtn" title="Verlauf löschen" aria-label="Verlauf löschen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat"></main>

  <div class="composer">
    <button class="icon-btn" id="micBtn" title="Spracheingabe" aria-label="Spracheingabe" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <textarea id="input" class="composer__input" placeholder="Nachricht an Jarvis…" rows="1"></textarea>
    <button class="icon-btn" id="voiceOutBtn" title="Antworten vorlesen" aria-label="Antworten vorlesen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="icon-btn send" id="sendBtn" title="Senden" aria-label="Senden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = "Du bist Jarvis, der persönliche KI-Assistent von Damaso. Damaso ist seit über zwei Jahrzehnten im Baugewerbe tätig, spezialisiert auf Verputzarbeiten, Trockenbau (Pladur) und Akustiklösungen. Er lebt in der Schweiz und plant den Umzug nach Galicien, Spanien. Antworte klar, knapp und hilfsbereit, standardmäßig auf Deutsch, außer Damaso schreibt in einer anderen Sprache. Du hast keinen Zugriff auf das Internet, Kalender, E-Mails oder Smart-Home-Geräte – sag das offen, wenn danach gefragt wird, statt zu raten.";
const STORAGE_KEY = "messages";
const MAX_STORED = 200;
const MAX_CONTEXT = 20;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const voiceOutBtn = document.getElementById('voiceOutBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');
const statusLabel = document.getElementById('statusLabel');

let messages = [];
let voiceOutput = false;
let busy = false;

function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }

function renderMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}

function renderLoading(){
  const div = document.createElement('div');
  div.className = 'msg assistant loading';
  div.innerHTML = '<span class="loading__level"><i></i></span><span class="loading__label">Jarvis denkt nach…</span>';
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}

function setBusy(b){
  busy = b;
  sendBtn.disabled = b;
  statusEl.classList.toggle('busy', b);
  statusLabel.textContent = b ? 'denkt nach' : 'bereit';
}

async function saveMessages(){
  try{
    const trimmed = messages.slice(-MAX_STORED);
    await window.storage.set(STORAGE_KEY, JSON.stringify(trimmed), false);
  }catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

async function loadMessages(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      messages = JSON.parse(res.value);
      messages.forEach(m => renderMessage(m.role, m.content));
      return true;
    }
  }catch(e){ /* noch nichts gespeichert */ }
  return false;
}

function speak(text){
  if(!voiceOutput || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const de = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
    if(de) utter.voice = de;
    utter.lang = de ? de.lang : 'de-DE';
    window.speechSynthesis.speak(utter);
  }catch(e){ console.error(e); }
}

async function callJarvis(){
  const apiMessages = messages.slice(-MAX_CONTEXT).map(m => ({role:m.role, content:m.content}));
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: apiMessages
    })
  });
  if(!response.ok) throw new Error('API-Fehler ' + response.status);
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  return textBlock ? textBlock.text : '…';
}

async function handleSend(){
  const text = inputEl.value.trim();
  if(!text || busy) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  messages.push({role:'user', content:text});
  renderMessage('user', text);
  saveMessages();

  setBusy(true);
  const loadingEl = renderLoading();
  try{
    const reply = await callJarvis();
    loadingEl.remove();
    messages.push({role:'assistant', content:reply});
    renderMessage('assistant', reply);
    saveMessages();
    speak(reply);
  }catch(e){
    loadingEl.remove();
    renderMessage('error', 'Da ist etwas schiefgelaufen. Prüf deine Verbindung und versuch es nochmal.');
    console.error(e);
  }finally{
    setBusy(false);
  }
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
});

voiceOutBtn.addEventListener('click', () => {
  voiceOutput = !voiceOutput;
  voiceOutBtn.classList.toggle('active', voiceOutput);
  if(!voiceOutput && 'speechSynthesis' in window) window.speechSynthesis.cancel();
});

resetBtn.addEventListener('click', async () => {
  if(!confirm('Gesprächsverlauf wirklich löschen?')) return;
  messages = [];
  chatEl.innerHTML = '';
  try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
  await greet();
});

// Spracheingabe (falls vom Browser unterstützt)
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognitionAPI){
  micBtn.hidden = false;
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = 'de-DE';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let listening = false;

  micBtn.addEventListener('click', () => {
    if(listening){ recognition.stop(); return; }
    try{ recognition.start(); }catch(e){}
  });
  recognition.addEventListener('start', () => { listening = true; micBtn.classList.add('active'); });
  recognition.addEventListener('end', () => { listening = false; micBtn.classList.remove('active'); });
  recognition.addEventListener('result', (e) => {
    const transcript = e.results[0][0].transcript;
    inputEl.value = transcript;
    handleSend();
  });
  recognition.addEventListener('error', () => { listening = false; micBtn.classList.remove('active'); });
}

async function greet(){
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Guten Tag' : 'Guten Abend';
  const text = greeting + ', Damaso. Ich bin Jarvis – womit kann ich helfen?';
  messages.push({role:'assistant', content:text});
  renderMessage('assistant', text);
  saveMessages();
}

(async function init(){
  const hadHistory = await loadMessages();
  if(!hadHistory) await greet();
})();
</script>
</body>
</html>
